<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a0c" />
<title>Our Story</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================================================
     OPENING SCREEN
     ============================================================ -->
<section id="opening-screen" aria-label="Opening">
  <div class="opening-bg">
    <img id="opening-photo" src="" alt="" />
    <div class="opening-scrim"></div>
  </div>

  <div class="opening-content">
    <p class="eyebrow" id="opening-eyebrow"></p>
    <h1 id="opening-title"></h1>
    <p class="opening-subtitle" id="opening-subtitle"></p>

    <button id="open-btn" type="button">
      <span id="open-btn-label">Open</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>

<!-- ============================================================
     MAIN EXPERIENCE (hidden until OPEN is pressed)
     ============================================================ -->
<main id="app" aria-hidden="true">

  <!-- HERO / ALBUM ------------------------------------------------ -->
  <section class="hero" id="hero">
    <div class="disc-wrap">
      <div class="disc" id="disc">
        <img id="hero-cover" src="" alt="" />
        <div class="disc-hole"></div>
      </div>
      <div class="disc-shadow"></div>
    </div>

    <p class="eyebrow" id="hero-eyebrow"></p>
    <h2 id="hero-title"></h2>
    <p class="hero-desc" id="hero-desc"></p>

    <!-- PLAYER -->
    <div class="player" id="player">
      <div class="player-meta">
        <div class="eq" id="eq" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="player-text">
          <p class="player-title" id="player-title"></p>
          <p class="player-artist" id="player-artist"></p>
        </div>
        <button class="play-toggle" id="play-toggle" type="button" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
      </div>

      <div class="progress-row">
        <span class="time" id="time-current">0:00</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-handle" id="progress-handle"></div>
        </div>
        <span class="time" id="time-duration">0:00</span>
      </div>
    </div>

    <div class="scroll-hint" aria-hidden="true">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- MEMORIES (generated by script.js from config.js) ------------ -->
  <section class="memories" id="memories"></section>

  <!-- LETTER -------------------------------------------------------->
  <section class="letter" id="letter">
    <p class="eyebrow" id="letter-label"></p>
    <h2 id="letter-heading"></h2>
    <p class="letter-body" id="letter-body"></p>
  </section>

  <!-- ENDING ---------------------------------------------------------->
  <section class="ending" id="ending">
    <div class="ending-photo-wrap">
      <img id="ending-photo" src="" alt="" />
    </div>
    <p class="eyebrow" id="ending-eyebrow"></p>
    <h2 id="ending-title"></h2>
    <p class="ending-message" id="ending-message"></p>
    <p class="ending-signature" id="ending-signature"></p>
  </section>

</main>

<!-- ============================================================
     STICKY MINI PLAYER (Spotify-style, stays while scrolling)
     ============================================================ -->
<div class="mini-player" id="mini-player" aria-hidden="true">
  <div class="mini-progress" id="mini-progress"></div>
  <div class="mini-player-inner">
    <div class="mini-disc" id="mini-disc">
      <img id="mini-cover" src="" alt="" />
    </div>
    <div class="mini-text">
      <p class="mini-title" id="mini-title"></p>
      <p class="mini-artist" id="mini-artist"></p>
    </div>
    <button class="mini-play" id="mini-play" type="button" aria-label="Play">
      <svg id="mini-icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="mini-icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
